name: griipbuddy-step8-preview
services:
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_GRIIP_ADMIN_PREFIX: /admin
    network_mode: host
    env_file: /opt/griipbuddy-step8-preview/private/admin.env
    environment:
      NEXT_PUBLIC_GRIIP_ADMIN_PREFIX: /admin
      GRIIP_ADMIN_TARGET: staging
      GRIIP_ADMIN_STAGE_WRITES: "1"
      GRIIP_ADMIN_PUBLIC_ORIGIN: https://dev.griipbuddy.com
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
