limit_req_zone $binary_remote_addr zone=griipbuddy_dev_admin_login:1m rate=6r/m;

server {
    listen 80;
    server_name dev.griipbuddy.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/griipbuddy-step8-preview/acme; }
    location / { return 308 https://dev.griipbuddy.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev.griipbuddy.com;

    ssl_certificate /etc/letsencrypt/live/dev.griipbuddy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.griipbuddy.com/privkey.pem;

    auth_basic "GriipBuddy isolated preview";
    auth_basic_user_file /etc/nginx/griipbuddy-step8-preview/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 6m;

    proxy_http_version 1.1;
    proxy_set_header Host dev.griipbuddy.com;
    proxy_set_header X-Forwarded-Host dev.griipbuddy.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 60s;

    location ~ ^/api/checkout/(admin|operator|receipt|reconcile|webhook)(/|$) { return 404; }
    location ~ ^/api/v1(?:/|$) { return 404; }
    location = /admin {
        auth_basic off;
        proxy_pass http://127.0.0.1:4318;
    }
    location = /admin/api/session {
        auth_basic off;
        limit_req zone=griipbuddy_dev_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4318;
    }
    location ^~ /admin/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4318;
    }
    location / { proxy_pass http://127.0.0.1:4317; }
}
