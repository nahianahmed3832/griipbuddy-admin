limit_req_zone $binary_remote_addr zone=griipbuddy_frontend_preview_login:1m rate=6r/m;

server {
    listen 80;
    server_name frontend.griipbuddy.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/griipbuddy-frontend-preview/acme; }
    location / { return 308 https://frontend.griipbuddy.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name frontend.griipbuddy.com;
    ssl_certificate /etc/letsencrypt/live/frontend.griipbuddy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontend.griipbuddy.com/privkey.pem;

    auth_basic "GriipBuddy isolated preview";
    auth_basic_user_file /etc/nginx/griipbuddy-step8-preview/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host frontend.griipbuddy.com;
    proxy_set_header X-Forwarded-Host frontend.griipbuddy.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 45s;

    location ~ ^/api/(v1|checkout)(/|$) { return 404; }
    location = /admin { proxy_pass http://127.0.0.1:4348; }
    location = /admin/api/session {
        limit_req zone=griipbuddy_frontend_preview_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4348;
    }
    location ^~ /admin/ { proxy_pass http://127.0.0.1:4348; }
    location / { proxy_pass http://127.0.0.1:4347; }
}
