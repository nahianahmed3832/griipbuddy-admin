name: griipbuddy-original-admin
services:
  original-admin:
    image: ${GRIIP_ORIGINAL_ADMIN_RELEASE:?Use the verified original admin image}
    environment:
      GRIIP_ORIGINAL_ADMIN_LISTEN: 0.0.0.0
      GRIIP_ORIGINAL_ADMIN_ORIGIN: ${GRIIP_ORIGINAL_ADMIN_ORIGIN:-https://devadmin.griipbuddy.com}
      GRIIP_ORIGINAL_ADMIN_MEDIA: /var/lib/griipbuddy/admin-media
      GRIIP_ORIGINAL_ADMIN_FRAUD_ORIGIN: http://fraud-provider:8080
      GRIIP_ADMIN_STAFF_PHONE: ${GRIIP_ADMIN_STAFF_PHONE:?Use the existing protected dev staff number}
      GRIIP_ADMIN_STAFF_EMAIL: ${GRIIP_ADMIN_STAFF_EMAIL:-}
    volumes: [media:/var/lib/griipbuddy/admin-media]
    networks: [integration]
    depends_on: [fraud-provider]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  fraud-provider:
    image: ${GRIIP_ORIGINAL_ADMIN_RELEASE:?Use the verified original admin image}
    command: ["node", "/opt/original-admin/fraud-provider.mjs"]
    networks: [integration, edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  edge:
    image: node:22.22.3-bookworm-slim
    user: node
    command: ["node", "/edge.mjs"]
    volumes: [./edge.mjs:/edge.mjs:ro]
    ports: ["127.0.0.1:4359:4359"]
    networks: [integration, edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  integration:
    external: true
    name: griipbuddy-step9-integration_isolated
  edge:
    external: true
    name: griipbuddy-step9-integration_edge
volumes:
  media:
