limit_req_zone $binary_remote_addr zone=griipbuddy_sandbox_quotes:1m rate=6r/s;

server {
    listen 80;
    server_name dev.griipbuddy.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/griipbuddy-step8-preview/acme; }
    location / { return 308 https://dev.griipbuddy.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name dev.griipbuddy.com;
    ssl_certificate /etc/letsencrypt/live/dev.griipbuddy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.griipbuddy.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    proxy_http_version 1.1;
    proxy_set_header Host dev.griipbuddy.com;
    proxy_set_header X-Forwarded-Host dev.griipbuddy.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 45s;

    location ~ ^/api/(v1|checkout|commerce|market|operations|session|storefront|workspace)(/|$) { return 404; }
    location = /admin { return 302 https://dev.griipbuddy.com/; }
    location ^~ /admin/ { return 302 https://dev.griipbuddy.com/; }
    location / { proxy_pass http://127.0.0.1:4368; }
}

server {
    listen 80;
    server_name frontend.griipbuddy.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/griipbuddy-frontend-preview/acme; }
    location / { return 308 https://frontend.griipbuddy.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name frontend.griipbuddy.com;
    ssl_certificate /etc/letsencrypt/live/frontend.griipbuddy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontend.griipbuddy.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host frontend.griipbuddy.com;
    proxy_set_header X-Forwarded-Host frontend.griipbuddy.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 45s;

    location ~ ^/api/(v1|checkout|account)(/|$) { return 404; }
    location ~ ^/api/reviews/(eligible|submit)(/|$) { return 404; }
    location = /admin { return 302 https://dev.griipbuddy.com/; }
    location ^~ /admin/ { return 302 https://dev.griipbuddy.com/; }
    location = /api/cart/quote {
        limit_req zone=griipbuddy_sandbox_quotes burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4367;
    }
    location / { proxy_pass http://127.0.0.1:4367; }
}
