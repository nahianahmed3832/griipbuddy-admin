# Load after editable-devadmin.compose.yaml with this service's protected environment file.
name: griipbuddy-classic-admin-dev
services:
  admin:
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "4363"
      GRIIP_ADMIN_PUBLIC_ORIGIN: https://classicdev.griipbuddy.com
      GRIIP_ADMIN_LAYOUT: classic
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/admin/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

volumes:
  expense-media:
    external: true
    name: griipbuddy-editable-devadmin_expense-media
