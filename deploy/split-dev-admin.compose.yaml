# Load after editable-devadmin.compose.yaml with this service's protected environment file.
name: griipbuddy-purple-admin-dev
services:
  admin:
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "4362"
      GRIIP_ADMIN_PUBLIC_ORIGIN: https://admindev.griipbuddy.com
      GRIIP_ADMIN_LAYOUT: purple
      GRIIP_MAIN_ADMIN_MARKETPLACE_ENABLED: "1"
      GRIIP_MAIN_ADMIN_MARKETPLACE_SECRET: ${GRIIP_MAIN_ADMIN_MARKETPLACE_SECRET:?Use the protected Marketplace bridge secret}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/admin/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

volumes:
  expense-media:
    external: true
    name: griipbuddy-editable-devadmin_expense-media
