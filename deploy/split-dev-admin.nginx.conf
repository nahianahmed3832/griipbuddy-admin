# Enable alongside split-dev-admin.bootstrap.nginx.conf after issuing the named TLS certificate.
limit_req_zone $binary_remote_addr zone=griipbuddy_purple_dev_login:1m rate=6r/m;
log_format griipbuddy_purple_dev '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admindev.griipbuddy.com;
    ssl_certificate /etc/letsencrypt/live/admindev.griipbuddy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admindev.griipbuddy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/purple-admin-dev.access.log griipbuddy_purple_dev;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 45s;

    location = / { return 302 /admin; }
    location = /admin { proxy_pass http://127.0.0.1:4362; }
    location = /admin/api/session {
        limit_req zone=griipbuddy_purple_dev_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4362;
    }
    location ~ ^/admin/api/(?:media/(?:video/)?upload|v1/upload/(?:video/)?(?:single|multiple))$ {
        client_max_body_size 512m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4362;
    }
    location /admin/ { proxy_pass http://127.0.0.1:4362; }
    location / { return 404; }
}
